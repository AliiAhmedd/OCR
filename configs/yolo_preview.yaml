# Visual check of the YOLO detector on real NFS images.
#   python -m id_classifier preview-detector --config configs/yolo_preview.yaml
# Writes boxes + crops to output_dir. These are copies of real IDs: data/ is gitignored, delete it after.
# Step 3 settings: the best prompt set of the detector sweep (sweep_20261005_053615).

preview:
  root: /mnt/nfs                 # NFS root as this machine sees it (WSL: /mnt/nfs)
  # Only these folders are ever read. Unrelated NFS folders (billing_reports, liveness, ...) are not listed.
  folders: [tun_nid_ocr, mar_nid_ocr, dza_nid_ocr, mar_driver_license_ocr, UAE_RESIDENT_ID_OCR]
  per_folder: 20                 # DISTINCT images per folder; same seed as the sweep = the same images
  unique_only: true              # skip byte-identical re-uploads
  seed: 42
  output_dir: data/detect_preview/id_card_015

  detector:
    type: yolo
    name: yoloe26s
    weights: yoloe-26s-seg.pt    # open-vocabulary YOLOE-26, downloaded on first use
    prompts: ["id card", "card"] # best prompt set in the sweep (22/37 images found at >= 0.15)
    confidence: 0.15             # ignore boxes below this
    duplicate_iou: 0.7           # boxes overlapping more than this = the same document
    image_size: 640

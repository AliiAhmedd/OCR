# Demo experiment on synthetic data. Runs with core + dev dependencies only.
#   python -m id_classifier generate-synthetic
#   python -m id_classifier evaluate --config configs/demo.yaml
# Paths are relative to the folder you run the command from (the repo root).

experiment_name: demo
ground_truth: data/synthetic/ground_truth.csv
output_dir: data/runs
repeats: 3                     # mocks are deterministic; repeats matter for real models (latency, sampling)

routing:
  confidence_threshold: 0.8    # below this a result goes to review

# Fixed BEFORE looking at the results (agreed rule):
selection_rule:
  min_negative_rejection_rate: 0.95
  max_parse_error_rate: 0.02
  primary_metric: country_accuracy_macro   # highest wins
  tie_breaker: latency_mean_ms             # lowest wins on a tie

# Each configuration = one detector + one or more classifiers (more than one = ensemble).
# MockClassifier scores only prove the harness works; they say nothing about real models.
configurations:
  - name: full_image+mock_perfect
    detector: {type: full_image}
    classifiers:
      - {type: mock, name: mock_perfect, error_rate: 0.0}

  - name: full_image+mock_good
    detector: {type: full_image}
    classifiers:
      - {type: mock, name: mock_good, error_rate: 0.05, seed: 3}

  - name: full_image+mock_noisy
    detector: {type: full_image}
    classifiers:
      - {type: mock, name: mock_noisy, error_rate: 0.25, parse_error_rate: 0.05, seed: 1}

  - name: full_image+ensemble_2_noisy
    detector: {type: full_image}
    classifiers:
      - {type: mock, name: mock_a, error_rate: 0.2, seed: 1}
      - {type: mock, name: mock_b, error_rate: 0.2, seed: 2}

  # With Ollama running and a vision model pulled, add (step 2):
  # - name: full_image+qwen_vl
  #   detector: {type: full_image}
  #   classifiers:
  #     - {type: vlm, name: qwen_vl, model: qwen2.5vl:7b}

# Used by: python -m id_classifier classify --config configs/demo.yaml
classify:
  source: {type: local_folder, path: data/synthetic/images}
  detector: {type: full_image}
  classifiers:
    - {type: mock, name: mock_good, error_rate: 0.05, seed: 3}
  database_url: sqlite:///data/pipeline.db

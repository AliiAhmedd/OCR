# Evaluation on the labeled NFS folders (real ID images, labels from folder + file name)."
#   python -m id_classifier build-ground-truth --root /mnt/nfs --per-folder 50
#   python -m id_classifier evaluate --config configs/nfs_eval.yaml
# Paths are relative to the folder you run the command from (the repo root).

experiment_name: nfs_eval
ground_truth: data/ground_truth.csv
output_dir: data/runs
repeats: 1                     # raise to 3 once a model's latency or sampling varies between runs

routing:
  confidence_threshold: 0.8    # below this a result goes to review

# Fixed BEFORE looking at the results (agreed rule). The NFS folders hold no "no document" images,
# so negative_rejection_rate is not measured (and not required) until such images are added.
selection_rule: # selection rules for the "best" configuration 
  min_negative_rejection_rate: 0.95
  max_parse_error_rate: 0.02
  primary_metric: country_accuracy_macro   # highest wins
  tie_breaker: latency_mean_ms             # lowest wins on a tie

# Shared detector: YOLOE-26 with the best prompts of the sweep (progress.md rows 5-6) + whole-image fallback.
yoloe: &yoloe
  type: yolo
  name: yoloe26s
  weights: yoloe-26s-seg.pt
  prompts: ["id card", "card"]
  confidence: 0.15
  duplicate_iou: 0.7
  image_size: 640
  fallback_full_image: true

# Each configuration = one detector + one or more classifiers (more than one = ensemble).
configurations:
  # A: DINOv2 embedding + k nearest labeled references. References = this ground truth, cropped by the
  #    same detector; each image skips its own picture (leave-one-out), so the score is honest.
  - name: A_yoloe+dinov2_knn
    detector: *yoloe
    classifiers:
      - type: knn
        name: dinov2_knn
        model: facebook/dinov2-small
        references: data/ground_truth.csv
        reference_detector: *yoloe
        k: 5
        min_similarity: 0.72       # below this: "unknown". Calibrated on run nfs_eval_20261006-130940 (progress.md row 12)

  # B: YOLO26 classification model trained on our crops (train-cls). Each image is classified by the fold
  #    model that never saw it (5-fold cross-validation), so the score is honest.
  - name: B_yoloe+yolo26_cls
    detector: *yoloe
    classifiers:
      - type: yolo_cls
        name: yolo26_cls
        models_dir: models/yolo26_cls
        min_probability: 0.5       # below this: "unknown"

  # D: ensemble of A and B. The router votes; any disagreement goes to review.
  - name: D_yoloe+knn+yolo26_cls
    detector: *yoloe
    classifiers:
      - type: knn
        name: dinov2_knn
        model: facebook/dinov2-small
        references: data/ground_truth.csv
        reference_detector: *yoloe
        k: 5
        min_similarity: 0.72
      - type: yolo_cls
        name: yolo26_cls
        models_dir: models/yolo26_cls
        min_probability: 0.5
